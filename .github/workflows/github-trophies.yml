name: Update GitHub Trophies

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  trophy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Trophies
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: Nick-0-7
          output_path: assets/github-trophies.svg
          token: ${{ secrets.PAT_1 }}

         - name: Find generated trophy
        run: |
          echo "Files generated:"
          find . -type f -name "*.svg" -print

      - name: Move trophy to assets
        run: |
          mkdir -p assets
          find . -type f -name "github-trophies.svg" -exec cp {} assets/github-trophies.svg \; || true

      - name: Verify trophy file
        run: |
          ls -lh assets/
          test -f assets/github-trophies.svg

      - name: Commit trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-trophies.svg
          git diff --cached --quiet || git commit -m "chore: update GitHub trophies"
          git push
