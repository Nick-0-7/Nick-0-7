name: Update GitHub Trophies

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  trophy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Trophies
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: Nick-0-7
          file: assets/github-trophies.svg
          token: ${{ secrets.PAT_1 }}
          theme: onedark
          max-rows: 1

      - name: Verify trophy file
        run: |
          echo "Checking generated trophy..."
          ls -lh assets/github-trophies.svg
          test -f assets/github-trophies.svg

      - name: Commit trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-trophies.svg
          git diff --cached --quiet || git commit -m "chore: update GitHub trophies"
          git push
