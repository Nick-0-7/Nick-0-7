
name: Profile Assets Guardian

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch previous screenshots
        run: |
          git fetch origin output:refs/remotes/origin/output
          mkdir -p existing-output
          git archive origin/output | tar -x -C existing-output

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Nick-0-7
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: Capture project screenshots
        run: |
          mkdir -p dist/previews captured-previews

          cat > capture.js <<'EOF'
          const { chromium } = require("playwright");

          const projects = [
            ["habit-tracker", "https://habit-tracker-127a9.firebaseapp.com/"],
            ["local-mart", "https://local-mart-liard.vercel.app/"],
            ["leetcode-tracker", "https://leetcode-tracker-bice.vercel.app/"],
            ["attenx", "https://atten-x-ten.vercel.app/"],
            ["campus-ai", "https://campus-ai-eta-bice.vercel.app/"],
            ["retina-screening", "https://retina-screening.vercel.app/"],
            ["ev-dashboard", "https://ev-dashboard-smoky.vercel.app/"]
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });

            try {
              for (const [name, url] of projects) {
                const page = await browser.newPage({
                  viewport: { width: 1440, height: 900 },
                  deviceScaleFactor: 1
                });

                try {
                  console.log(`Capturing ${name}: ${url}`);

                  const response = await page.goto(url, {
                    waitUntil: "domcontentloaded",
                    timeout: 90000
                  });

                  if (!response || response.status() >= 400) {
                    throw new Error(
                      `Deployment returned HTTP ${response?.status() ?? "no response"}`
                    );
                  }

                  await page.waitForTimeout(4000);

                  await page.screenshot({
                    path: `captured-previews/${name}.png`,
                    fullPage: false
                  });

                  console.log(`Captured ${name}`);
                } catch (error) {
                  console.error(`${name} capture failed: ${error.message}`);
                } finally {
                  await page.close();
                }
              }
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

          node capture.js

      - name: Use fresh screenshots or restore previous versions
        run: |
          projects="habit-tracker local-mart leetcode-tracker attenx campus-ai retina-screening ev-dashboard"

          for project in $projects; do
            if test -s "captured-previews/$project.png"; then
              cp "captured-previews/$project.png" "dist/previews/$project.png"
              echo "Using fresh screenshot: $project"

            elif test -s "existing-output/previews/$project.png"; then
              cp "existing-output/previews/$project.png" "dist/previews/$project.png"
              echo "Restored previous screenshot: $project"

            else
              echo "ERROR: No screenshot available for $project"
              exit 1
            fi
          done

      - name: Verify generated assets
        run: |
          test -s dist/github-contribution-grid-snake.svg
          test -s dist/github-contribution-grid-snake-dark.svg

          for project in habit-tracker local-mart leetcode-tracker attenx campus-ai retina-screening ev-dashboard; do
            test -s "dist/previews/$project.png"
            file "dist/previews/$project.png"
          done

      - name: Publish profile assets
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
