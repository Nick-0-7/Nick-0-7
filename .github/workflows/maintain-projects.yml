name: Maintain Project Index

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update project index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import html
          import json
          import os
          import urllib.request

          username = "Nick-0-7"

          API = "https://api.github.com"

          HEADERS = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "Nick-0-7-project-index"
          }

          def github_get(url):
              request = urllib.request.Request(
                  url,
                  headers=HEADERS
              )

              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          # --------------------------------------------------
          # Curated project information
          # --------------------------------------------------

          project_overrides = {

              "Habit-Tracker": {
                  "title": "🧠 Habit Tracker",
                  "description": (
                      "Visual habit-tracking application for "
                      "building consistency and analyzing daily progress."
                  ),
                  "tech": "HTML • CSS • JavaScript • Chart.js"
              },

              "Local_Mart": {
                  "title": "🛒 LocalMart",
                  "description": (
                      "Hyperlocal marketplace connecting local buyers "
                      "and sellers through product listings and search."
                  ),
                  "tech": "HTML • CSS • JavaScript • Firebase"
              },

              "retina-screening": {
                  "title": "🩺 Retina Screening",
                  "description": (
                      "AI-based retinal screening project focused on "
                      "detecting retinal conditions from medical images."
                  ),
                  "tech": "Python • Machine Learning"
              },

              "strawhat": {
                  "title": "⚙️ Strawhat",
                  "description": (
                      "Software project exploring practical web "
                      "development and application building."
                  ),
                  "tech": "JavaScript"
              }
          }

          # --------------------------------------------------
          # Fetch repositories
          # --------------------------------------------------

          repositories = []
          page = 1

          while True:

              url = (
                  f"{API}/users/{username}/repos"
                  f"?per_page=100&page={page}&sort=updated"
              )

              data = github_get(url)

              if not data:
                  break

              repositories.extend(data)

              if len(data) < 100:
                  break

              page += 1

          # --------------------------------------------------
          # Excluded repositories
          # --------------------------------------------------

          excluded = {
              username.lower(),
              "github-readme-streak-stats",
              "leetcode",
              "portfolio"
          }

          repositories = [
              repo
              for repo in repositories
              if not repo["fork"]
              and not repo["archived"]
              and repo["name"].lower() not in excluded
          ]

          # --------------------------------------------------
          # Priority order for recruiter-facing projects
          # --------------------------------------------------

          priority = [
              "Habit-Tracker",
              "Local_Mart",
              "retina-screening",
              "strawhat"
          ]

          priority_map = {
              name.lower(): index
              for index, name in enumerate(priority)
          }

          repositories.sort(
              key=lambda repo: (
                  priority_map.get(
                      repo["name"].lower(),
                      999
                  ),
                  -repo["stargazers_count"],
                  -repo["forks_count"],
                  repo["name"].lower()
              )
          )

          repositories = repositories[:10]

          # --------------------------------------------------
          # Generate project cards
          # --------------------------------------------------

          cards = []

          for repo in repositories:

              repo_name = repo["name"]

              override = project_overrides.get(
                  repo_name
              )

              if override:

                  title = override["title"]

                  description = override["description"]

                  tech = override["tech"]

              else:

                  title = "📦 " + repo_name

                  description = (
                      repo["description"]
                      or "Software project and development work."
                  )

                  language = (
                      repo["language"]
                      or "Multiple technologies"
                  )

                  tech = language

              title = html.escape(
                  title,
                  quote=False
              )

              description = html.escape(
                  description,
                  quote=False
              )

              tech = html.escape(
                  tech,
                  quote=False
              )

              github_link = html.escape(
                  repo["html_url"]
              )

              stars = repo["stargazers_count"]

              homepage = repo.get("homepage")

              demo_html = ""

              if homepage:

                  homepage = homepage.strip()

                  if homepage:

                      safe_homepage = html.escape(
                          homepage,
                          quote=True
                      )

                      demo_html = (
                          f"""
          &nbsp;•&nbsp;
          <a href="{safe_homepage}">🌐 Live Demo</a>
          """
                      )

              card = f"""
          <td width="50%" valign="top">

          <h3>
          <a href="{github_link}">
          {title}
          </a>
          </h3>

          <p>
          {description}
          </p>

          <p>
          <b>Tech:</b> {tech}
          </p>

          <p>
          ⭐ {stars}
          </p>

          <p>
          <a href="{github_link}">💻 GitHub</a>
          {demo_html}
          </p>

          </td>
          """

              cards.append(card)

          # --------------------------------------------------
          # Arrange cards in two columns
          # --------------------------------------------------

          rows = []

          for index in range(
              0,
              len(cards),
              2
          ):

              left = cards[index]

              right = ""

              if index + 1 < len(cards):
                  right = cards[index + 1]

              rows.append(
                  f"""
          <tr>
          {left}
          {right}
          </tr>
          """
              )

          # --------------------------------------------------
          # Replace README project section
          # --------------------------------------------------

          start = "<!-- PROJECTS_START -->"
          end = "<!-- PROJECTS_END -->"

          with open(
              "README.md",
              "r",
              encoding="utf-8"
          ) as file:

              readme = file.read()

          section = f"""
          {start}

          <table>
          {''.join(rows)}
          </table>

          {end}
          """

          if start in readme and end in readme:

              before = readme.split(
                  start,
                  1
              )[0]

              after = readme.split(
                  end,
                  1
              )[1]

              readme = (
                  before
                  + section
                  + after
              )

          else:

              readme += (
                  "\n\n"
                  "## 📚 Project Index\n\n"
                  + section
                  + "\n"
              )

          with open(
              "README.md",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(readme)

          print(
              f"Project index updated with "
              f"{len(repositories)} repositories."
          )
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: improve project index"
            git push
          fi
