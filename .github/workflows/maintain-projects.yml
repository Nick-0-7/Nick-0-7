name: Maintain Project Index

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update project index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          username = "Nick-0-7"

          url = f"https://api.github.com/users/{username}/repos?per_page=100&sort=updated"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json"
              }
          )

          with urllib.request.urlopen(request) as response:
              repos = json.load(response)

          excluded = {
              username.lower(),
              "github-readme-streak-stats"
          }

          repos = [
              r for r in repos
              if not r["fork"]
              and not r["archived"]
              and r["name"].lower() not in excluded
          ]

          repos.sort(
              key=lambda r: (
                  r["stargazers_count"],
                  r["forks_count"],
                  r["updated_at"]
              ),
              reverse=True
          )

          repos = repos[:10]

          rows = []

          for repo in repos:
              name = repo["name"]
              description = repo["description"] or "No description provided."
              stars = repo["stargazers_count"]
              updated = repo["updated_at"][:10]
              link = repo["html_url"]

              rows.append(
                  f"| [{name}]({link}) | {description} | ⭐ {stars} | {updated} |"
              )

          start = "<!-- PROJECTS_START -->"
          end = "<!-- PROJECTS_END -->"

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          section = f"""\
          {start}
          | Repository | Description | Stars | Updated |
          |---|---|---:|---|
          {chr(10).join(rows)}
          {end}"""

          if start in readme and end in readme:
              before = readme.split(start)[0]
              after = readme.split(end, 1)[1]
              readme = before + section + after
          else:
              readme += "\n\n## 📚 Project Index\n\n" + section + "\n"

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(readme)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update project index"
            git push
          fi
