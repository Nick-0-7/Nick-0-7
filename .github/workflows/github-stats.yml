name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create stats directory
        run: mkdir -p assets

      - name: Download GitHub Stats
        run: |
          curl -L "https://github-readme-stats-nick-0-7s-projects.vercel.app/api?username=Nick-0-7&show_icons=true&theme=tokyonight&hide_border=true" \
            -o assets/github-stats.svg

      - name: Download Top Languages
        run: |
          curl -L "https://github-readme-stats-nick-0-7s-projects.vercel.app/api/top-langs/?username=Nick-0-7&layout=compact&theme=tokyonight&hide_border=true" \
            -o assets/top-langs.svg

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-stats.svg assets/top-langs.svg

          git diff --cached --quiet || git commit -m "chore: update GitHub stats [skip ci]"
          git push
